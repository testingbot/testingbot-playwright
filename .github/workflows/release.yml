name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check that the tag matches package.json
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          test "${GITHUB_REF_NAME#v}" = "$VERSION" || { echo "Tag $GITHUB_REF_NAME does not match version $VERSION"; exit 1; }
      # No token: npm exchanges the GitHub OIDC token for a short-lived publish token. Configure the
      # trusted publisher (this workflow file, environment "npm") on npmjs.com or with `npm trust`.
      - run: npm publish --access public
