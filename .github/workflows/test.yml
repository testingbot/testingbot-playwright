name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Check the package contents
        run: npm pack --dry-run

  compat:
    # Loads the example's tests with the oldest supported and other Playwright versions. Fixtures
    # are checked when the tests load, so this catches fixtures a version does not have.
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        playwright: ['1.49.1', '1.56.1', 'latest']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm pack
      - name: List the example's tests with @playwright/test ${{ matrix.playwright }}
        working-directory: examples/basic
        env:
          TESTINGBOT_KEY: dummy
          TESTINGBOT_SECRET: dummy
        run: |
          npm install --no-save @playwright/test@${{ matrix.playwright }} ../../testingbot-playwright-*.tgz
          npx playwright test --list

  e2e:
    # Runs the example project on TestingBot. Needs the TESTINGBOT_KEY / TESTINGBOT_SECRET secrets,
    # which are not available to pull requests from forks.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: test
    runs-on: ubuntu-latest
    env:
      TESTINGBOT_KEY: ${{ secrets.TESTINGBOT_KEY }}
      TESTINGBOT_SECRET: ${{ secrets.TESTINGBOT_SECRET }}
    steps:
      - name: Check for TestingBot credentials
        if: env.TESTINGBOT_KEY == '' || env.TESTINGBOT_SECRET == ''
        run: echo "::notice::TESTINGBOT_KEY/TESTINGBOT_SECRET secrets are not set, skipping the live run"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Pack the package
        run: npm pack
      - name: Run the example on TestingBot
        if: env.TESTINGBOT_KEY != '' && env.TESTINGBOT_SECRET != ''
        working-directory: examples/basic
        run: |
          npm install
          npm install --no-save ../../testingbot-playwright-*.tgz
          npx playwright test --trace on --reporter=list,json,html
        env:
          TESTINGBOT_BUILD: github-${{ github.run_id }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
          PLAYWRIGHT_HTML_OPEN: never
      - name: Check that no report or trace contains the credentials
        if: env.TESTINGBOT_KEY != '' && env.TESTINGBOT_SECRET != ''
        working-directory: examples/basic
        run: |
          leaks=0
          for f in $(find test-results playwright-report results.json testingbot-sessions.json -type f 2>/dev/null); do
            case "$f" in *.zip) content=$(unzip -p "$f") ;; *) content=$(cat "$f") ;; esac
            for value in "$TESTINGBOT_KEY" "$TESTINGBOT_SECRET"; do
              if printf '%s' "$content" | grep -aqF "$value"; then echo "::error::$f contains TestingBot credentials"; leaks=1; fi
            done
          done
          exit $leaks
